[project]
name = "voice_ai"
version = "0.1.0"
description = "Local Russian voice AI assistant"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7",
    "faiss-cpu>=1.15",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "omegaconf>=2.3",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "numpy>=1.26",
    "scipy>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=1.1.0",
    "langchain-community>=0.4.0",
    "pypdf>=4.0.0",
    "ddgs>=6.0.0",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "colorama>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "torch", "torchaudio", "scipy.*", "langchain_openai", "langchain_core.*", "langchain_huggingface", "langchain_community.*", "langchain_text_splitters", "langgraph.*", "ddgs", "pypdf", "typing_extensions"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]
