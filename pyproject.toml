[project]
name = "voice_ai"
version = "0.1.0"
description = "Local Russian voice AI assistant"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "torch", "torchaudio", "scipy.*", "langchain_openai", "langchain_core.*", "langchain_chroma", "langchain_huggingface", "langchain_community.*", "langchain_text_splitters", "langgraph.*", "chromadb.*", "duckduckgo_search", "pypdf", "typing_extensions"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]
