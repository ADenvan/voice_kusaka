[project]
name = "voice_ai"
version = "0.1.0"
description = "Local Russian voice AI assistant"
requires-python = ">=3.13"
dependencies = [
    # Core
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "omegaconf==2.3.1",
    # Audio
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "numpy==2.5.2",
    "scipy==1.18.1",
    # LLM / API
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "langchain-openai==1.6.1",
    "langchain-ollama==1.1.0",
    "langchain-core==1.6.2",
    "langgraph==1.2.11",
    "langchain-huggingface==1.2.2",
    "langchain-chroma==1.1.0",
    "langchain-text-splitters==1.1.2",
    "langchain-community==0.4.0",
    "chromadb==1.5.9",
    "pypdf==6.18.0",
    "duckduckgo-search==8.1.1",
    # Storage
    "aiosqlite==0.22.1",
    # CLI
    "typer==0.27.2",
    "colorama==0.4.6",
    # Logging
    "loguru==0.7.3",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    # Testing
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    # Code Quality
    "ruff==0.16.5",
    "mypy==2.3.1",
    # Security
    "bandit>=1.8",
    "pip-audit>=2.7",
    # Debug & REPL
    "ipython==9.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["voice_ai*"]
namespaces = false

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["voice_ai"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "torch", "torchaudio", "scipy.*", "langchain_openai", "langchain_ollama", "langchain_core.*", "langchain_chroma", "langchain_huggingface", "langchain_community.*", "langchain_text_splitters", "langgraph.*", "chromadb.*", "duckduckgo_search", "pypdf", "typing_extensions"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]
